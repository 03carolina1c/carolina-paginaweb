<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Maquiagem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333333;
        }

        header {
            background-color: rgb(255, 0, 119);
            color: white;
            padding: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .autor {
            font-style: italic;
            font-size: 0.95em;
            margin-top: 5px;
        }

        main {
            background-color: white;
            color: #333333;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px; 
            box-sizing: border-box;
        }

        img {
            width: 80px;
            height: 80px; 
        }

        main h2 {
            color: rgb(255, 0, 119);
            margin-top: 0;
        }

        p {
            font-weight: bold;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog make</h1>
        <p>Vou compartilhar conhecimentos de beleza e maquiagem</p>
        <p class="autor">Por: Carol Borges</p>
    </header>

    <main> 
        <img src="imagem - blog.png" alt="Ícone do blog Maquiagem e Beleza em tons de rosa com design minimalista">
        
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Marcelo Paludetto</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        </div>
    </main>

</body>
</html>
