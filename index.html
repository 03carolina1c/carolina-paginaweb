<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Maquiagem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333333;
        }

        header {
            background-color: rgb(255, 0, 119);
            color: white;
            padding: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .autor {
            font-style: italic;
            font-size: 0.95em;
            margin-top: 5px;
        }

        main {
            background-color: white;
            color: #333333;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px; 
            box-sizing: border-box;
        }

        img {
            width: 80px;
            height: 80px; 
        }

        main h2 {
            color: rgb(255, 0, 119);
            margin-top: 0;
        }

        p {
            font-weight: bold;
        }

        .artigo-autor {
            font-weight: bold;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            font-size: 1rem;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 8px; /* Adicionado um espaço entre os botões */
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu blog make</h1>
        <p>Vou compartilhar conhecimentos de beleza e maquiagem.</p>
    </header>
    <main>
        <img src="imagem - blog.png"
        alt="No centro do circulo, um desenho em linhas finas e elegantes combinando um olho marcante
        com cilios volumosos e um delineado bem definido, cruzado delicadamente por um pincel de maquiagem
        na diagonal">
        <h2>Meu primeiro post</h2>
        <p>Por: Carol borges</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar conhecimentos de beleza e maquiagem</p>
        
        <!-- Botão de Joinha -->
        <button id="botao-like">👍 <span>0</span></button>
        
        <!-- Botão de Coração -->
        <button id="botao-heart">🩷​ <span>0</span></button>
    </main>
    <script>
        // Seleciona o botão de joinha
        const botaoLike = document.querySelector("#botao-like");
        botaoLike.addEventListener("click", clicarLike);

        function clicarLike(){
            let texto = botaoLike.querySelector("span");
            let contador = Number(texto.textContent);
            texto.textContent = contador + 1;
        }

        // Seleciona o botão de coração
        const botaoHeart = document.querySelector("#botao-heart");
        botaoHeart.addEventListener("click", clicarHeart);

        function clicarHeart(){
            let texto = botaoHeart.querySelector("span");
            let contador = Number(texto.textContent);
            texto.textContent = contador + 1;
        }
    </script>
</body>
</html>
